[package]
name = "sequence"
version = "0.1.0"
edition = "2021"
description = "SEQUENCE OS¹ - AI Operating System with persistent memory, identity, and execution"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.1", features = ["json"] }
walkdir = "2.5"
