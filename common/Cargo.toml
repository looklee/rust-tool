[package]
name = "common"
version = "0.1.0"
edition = "2021"
description = "Common utilities for rust-tool projects"
license = "MIT"

[dependencies]
atty = "0.2"
regex = { version = "1.10", optional = true }
chrono = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
walkdir = "2.4"
thiserror = "1.0"
toml = "0.8"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[features]
default = []
color = ["dep:atty"]
regex = ["dep:regex"]
chrono = ["dep:chrono"]