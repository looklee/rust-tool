name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy on common and code
        run: |
          echo "=== Running clippy on common ==="
          cargo clippy -p common --all-targets -- -D warnings --verbose
          echo "=== Running clippy on code ==="
          cargo clippy -p code --all-targets -- -D warnings --verbose

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests on common and code
        run: |
          echo "=== Testing common ==="
          cargo test -p common --verbose
          echo "=== Testing code ==="
          cargo test -p code --verbose

  build:
    name: Build Tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build code tool
        run: |
          echo "=== Building common ==="
          cargo build --release -p common --verbose
          echo "=== Building code ==="
          cargo build --release -p code --verbose
          echo "=== Build artifacts ==="
          ls -la target/release/code 2>/dev/null || echo "Binary not found"
          ls -la target/release/ 2>&1 | head -20
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: code-binary
          path: target/release/code
