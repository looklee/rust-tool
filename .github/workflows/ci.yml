name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1

  build:
    name: Build Tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build code tool
        run: |
          set -o pipefail
          echo "=== Building common ==="
          cargo build --release -p common 2>&1
          echo "=== Building code ==="
          cargo build --release -p code 2>&1
          echo "=== Build artifacts ==="
          ls -la target/release/code 2>/dev/null || echo "Binary not found"
          ls -la target/release/ 2>&1 | head -20
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: code-binary
          path: target/release/code
