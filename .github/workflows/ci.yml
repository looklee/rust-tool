name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting on common
        run: cargo fmt -p common -- --check
      - name: Check formatting on code
        run: cargo fmt -p code -- --check
      - name: Run clippy on common
        run: cargo clippy -p common --all-targets -- -D warnings
      - name: Run clippy on code
        run: cargo clippy -p code --all-targets -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests on common
        run: cargo test -p common --verbose
      - name: Run tests on code
        run: cargo test -p code --verbose

  build:
    name: Build Tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build common
        run: cargo build --release -p common
      - name: Build code
        run: cargo build --release -p code
      - name: Verify build artifacts
        run: |
          ls -la target/release/code 2>/dev/null || echo "Binary not found"
          ls -la target/release/ 2>&1 | head -20
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: code-binary
          path: target/release/code

  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check common module structure
        run: |
          echo "=== Common module structure ==="
          ls -la common/src/
          ls -la common/src/config/
          ls -la common/src/errors/
          ls -la common/src/logging/
          ls -la common/src/cli/
          ls -la common/src/utils/
      - name: Check code entry point
        run: |
          echo "=== Code entry point ==="
          ls -la code/src/
          head -20 code/src/main.rs